<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070B14">
<title>Admin — Procepal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070B14; --surface: #0D1525; --card: #111d33; --card2: #162040;
  --border: #1e2d4a; --border2: #263650;
  --accent: #00E5B0; --accent-dim: #00E5B018;
  --accent2: #4D8EFF; --accent2-dim: #4D8EFF18;
  --warn: #F4A84A; --danger: #FF4D6A; --success: #00D18C;
  --purple: #9B7EFF;
  --text: #E4EBF8; --text2: #9BAAC4; --dim: #5A6B8A; --dim2: #2D3D57;
  --r: 14px; --r-sm: 10px; --r-lg: 20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── LOGIN ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:28px;background:var(--bg)}
.login-logo{font-size:32px;margin-bottom:8px}
.login-title{font-family:'Bricolage Grotesque',sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:4px;background:linear-gradient(135deg,#E4EBF8 30%,#5A6B8A);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{font-size:13px;color:var(--dim);margin-bottom:32px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.l-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.l-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 15px;font-size:15px;color:var(--text);font-family:'Space Grotesk',sans-serif;outline:none;transition:border-color .2s;margin-bottom:14px}
.l-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.l-pass-wrap{position:relative;margin-bottom:14px}
.l-pass-wrap .l-input{margin-bottom:0;padding-right:44px}
.l-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--dim);font-size:18px;line-height:1;padding:4px}
.l-eye:hover{color:var(--text)}
.l-remember{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:14px;cursor:pointer}
.l-remember input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}
.l-btn{width:100%;background:var(--accent);color:#070B14;border:none;border-radius:var(--r-sm);padding:14px;font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;letter-spacing:.5px;transition:opacity .15s}
.l-btn:active{opacity:.85}
.l-err{font-size:12px;color:var(--danger);text-align:center;margin-top:8px;min-height:18px}

/* ── APP ── */
#app{display:none;height:100%;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--purple)22,var(--accent2)22);border:1px solid var(--purple)33;display:flex;align-items:center;justify-content:center;font-size:16px}
.topbar-title{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.4px}
.topbar-badge{font-size:10px;font-weight:600;background:var(--purple)22;color:var(--purple);border:1px solid var(--purple)44;border-radius:6px;padding:2px 7px;letter-spacing:.5px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-logout{background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:12px;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:border-color .2s}
.btn-logout:hover{border-color:var(--danger);color:var(--danger)}

/* ── SCROLL AREA ── */
.scroll-area{flex:1;overflow-y:auto;padding:18px 16px 100px;-webkit-overflow-scrolling:touch}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-track{background:transparent}
.scroll-area::-webkit-scrollbar-thumb{background:var(--dim2);border-radius:2px}

/* ── HEADER DE SECCIÓN ── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-title{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.5px}
.section-sub{font-size:12px;color:var(--dim);margin-top:2px}
.btn-new{display:flex;align-items:center;gap:6px;background:var(--accent);color:#070B14;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;letter-spacing:.3px;transition:opacity .15s;flex-shrink:0}
.btn-new:active{opacity:.85}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.stat-val{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:4px;letter-spacing:.3px}

/* ── SEARCH ── */
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);font-family:'Space Grotesk',sans-serif;outline:none}
.search-input:focus{border-color:var(--accent)}
.filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--text2);font-family:'Space Grotesk',sans-serif;cursor:pointer;white-space:nowrap;transition:border-color .2s}
.filter-btn.active{border-color:var(--accent2);color:var(--accent2);background:var(--accent2-dim)}

/* ── USER CARDS ── */
.user-list{display:flex;flex-direction:column;gap:10px}
.user-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:border-color .2s;cursor:pointer}
.user-card:hover{border-color:var(--border2)}
.user-card.inactive{opacity:.55}
.user-card-top{display:flex;align-items:center;gap:12px}
.user-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent2)33,var(--purple)33);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--accent2);flex-shrink:0;font-family:'Bricolage Grotesque',sans-serif}
.user-info{flex:1;min-width:0}
.user-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}
.badge-admin{color:#FFD700;background:#FFD70018;border-color:#FFD70044}
.badge-director{color:var(--accent2);background:var(--accent2-dim);border-color:var(--accent2)44}
.badge-operativo{color:var(--accent);background:var(--accent-dim);border-color:var(--accent)44}
.badge-trabajador{color:var(--text2);background:#ffffff0a;border-color:var(--border)}
.badge-inactivo{color:var(--danger);background:rgba(255,77,106,.1);border-color:rgba(255,77,106,.3)}
.app-chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase}
.app-finanzas{color:#00E5B0;background:#00E5B012;border:1px solid #00E5B033}
.app-metalek{color:#4D8EFF;background:#4D8EFF12;border:1px solid #4D8EFF33}
.app-checador{color:#F4A84A;background:#F4A84A12;border:1px solid #F4A84A33}
.app-requisiciones{color:#9B7EFF;background:#9B7EFF12;border:1px solid #9B7EFF33}
.user-date{font-size:11px;color:var(--dim);margin-left:auto}

/* ── SHEET (Modal) ── */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;backdrop-filter:blur(4px)}
.sheet-overlay.open{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;width:100%;max-width:500px;padding:24px 20px 40px;max-height:90vh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;background:var(--dim2);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.4px;margin-bottom:20px}
.field{margin-bottom:16px}
.field-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.field-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 15px;font-size:15px;color:var(--text);font-family:'Space Grotesk',sans-serif;outline:none;transition:border-color .2s}
.field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.field-input::placeholder{color:var(--dim)}
.field-select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 15px;font-size:15px;color:var(--text);font-family:'Space Grotesk',sans-serif;outline:none;appearance:none;cursor:pointer}
.field-select:focus{border-color:var(--accent)}
.apps-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.app-toggle{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;user-select:none}
.app-toggle input{display:none}
.app-toggle.checked{border-color:var(--accent);background:var(--accent-dim)}
.app-toggle-icon{font-size:18px}
.app-toggle-name{font-size:13px;font-weight:600}
.btn-save{width:100%;background:var(--accent);color:#070B14;border:none;border-radius:var(--r-sm);padding:14px;font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;margin-top:4px;transition:opacity .15s}
.btn-save:active{opacity:.85}
.btn-save:disabled{opacity:.4;cursor:not-allowed}
.btn-cancel{width:100%;background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--r-sm);padding:12px;font-size:14px;font-family:'Space Grotesk',sans-serif;cursor:pointer;margin-top:8px;transition:border-color .2s}
.btn-cancel:hover{border-color:var(--text2);color:var(--text)}
.btn-danger-outline{width:100%;background:none;border:1px solid rgba(255,77,106,.4);color:var(--danger);border-radius:var(--r-sm);padding:12px;font-size:14px;font-family:'Space Grotesk',sans-serif;cursor:pointer;margin-top:8px;transition:border-color .2s}
.btn-danger-outline:hover{border-color:var(--danger);background:rgba(255,77,106,.08)}
.field-hint{font-size:11px;color:var(--dim);margin-top:5px}
.divider{height:1px;background:var(--border);margin:16px 0}
.section-mini{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:12px 20px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;z-index:500;transition:all .25s;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--success)66;background:rgba(0,209,140,.12);color:var(--success)}
.toast.err{border-color:var(--danger)66;background:rgba(255,77,106,.12);color:var(--danger)}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--dim)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.empty-sub{font-size:13px}

/* ── LOADING ── */
.loading{text-align:center;padding:40px;color:var(--dim);font-size:14px}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-logo">🛡️</div>
  <div class="login-title">Administración</div>
  <div class="login-sub">Procepal — Panel de control</div>
  <div class="login-card">
    <div class="l-label">Correo electrónico</div>
    <input class="l-input" id="l-email" type="email" placeholder="admin@procepal.com" autocomplete="email">
    <div class="l-label">Contraseña</div>
    <div class="l-pass-wrap">
      <input class="l-input" id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="l-eye" type="button" onclick="togglePass(this)" title="Ver contraseña">👁</button>
    </div>
    <label class="l-remember">
      <input type="checkbox" id="l-remember" onchange="onRememberChange()"> Recordar correo
    </label>
    <button class="l-btn" onclick="doLogin()">Ingresar</button>
    <div class="l-err" id="l-err"></div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app" style="display:none;flex-direction:column;height:100%">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-icon">🛡️</div>
      <div>
        <div class="topbar-title">Admin Procepal</div>
      </div>
      <div class="topbar-badge">admin</div>
    </div>
    <div class="topbar-right">
      <span id="topbar-name" style="font-size:13px;color:var(--text2)"></span>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="scroll-area" id="main-area">
    <div class="loading">Cargando usuarios...</div>
  </div>
</div>

<!-- ── SHEET: Crear / Editar usuario ── -->
<div class="sheet-overlay" id="sheet-user" onclick="closeSheet(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">Nuevo usuario</div>

    <input type="hidden" id="user-id">

    <div class="field">
      <div class="field-label">Nombre completo</div>
      <input class="field-input" id="user-nombre" type="text" placeholder="Nombre Apellido">
    </div>
    <div class="field">
      <div class="field-label">Correo electrónico</div>
      <input class="field-input" id="user-email" type="email" placeholder="usuario@procepal.com">
    </div>
    <div class="field" id="field-password">
      <div class="field-label">Contraseña</div>
      <input class="field-input" id="user-password" type="password" placeholder="Mínimo 8 caracteres">
      <div class="field-hint">El usuario podrá cambiarla después</div>
    </div>
    <div class="field">
      <div class="field-label">Rol</div>
      <select class="field-select" id="user-rol">
        <option value="admin">👑 Administrador — acceso total</option>
        <option value="director">📊 Director — reportes y aprobaciones</option>
        <option value="operativo" selected>⚙️ Operativo — MetalTek y materiales</option>
        <option value="trabajador">👷 Trabajador — checador y requisiciones</option>
      </select>
    </div>

    <div class="field">
      <div class="field-label">Acceso a apps</div>
      <div class="apps-grid">
        <label class="app-toggle" id="toggle-finanzas" onclick="toggleApp('finanzas',this)">
          <input type="checkbox" value="finanzas">
          <span class="app-toggle-icon">💰</span>
          <span class="app-toggle-name">Finanzas</span>
        </label>
        <label class="app-toggle" id="toggle-metalek" onclick="toggleApp('metalek',this)">
          <input type="checkbox" value="metalek">
          <span class="app-toggle-icon">🏗️</span>
          <span class="app-toggle-name">MetalTek</span>
        </label>
        <label class="app-toggle" id="toggle-checador" onclick="toggleApp('checador',this)">
          <input type="checkbox" value="checador">
          <span class="app-toggle-icon">📍</span>
          <span class="app-toggle-name">Checador</span>
        </label>
        <label class="app-toggle" id="toggle-requisiciones" onclick="toggleApp('requisiciones',this)">
          <input type="checkbox" value="requisiciones">
          <span class="app-toggle-icon">📋</span>
          <span class="app-toggle-name">Requisiciones</span>
        </label>
      </div>
    </div>

    <button class="btn-save" id="btn-save" onclick="saveUser()">Guardar usuario</button>
    <button class="btn-cancel" onclick="document.getElementById('sheet-user').classList.remove('open')">Cancelar</button>

    <div id="edit-extra" style="display:none">
      <div class="divider"></div>
      <div class="section-mini">Acciones adicionales</div>
      <button class="btn-cancel" onclick="showResetPassword()">🔑 Cambiar contraseña</button>
      <button class="btn-danger-outline" id="btn-toggle-activo" onclick="toggleActivo()"></button>
      <button class="btn-danger-outline" onclick="deleteUser()">🗑 Eliminar usuario permanentemente</button>
    </div>
  </div>
</div>

<!-- ── SHEET: Reset password ── -->
<div class="sheet-overlay" id="sheet-reset" onclick="closeSheetReset(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Cambiar contraseña</div>
    <div class="field">
      <div class="field-label">Nueva contraseña</div>
      <input class="field-input" id="reset-pass" type="password" placeholder="Mínimo 8 caracteres">
    </div>
    <button class="btn-save" onclick="doResetPassword()">Actualizar contraseña</button>
    <button class="btn-cancel" onclick="document.getElementById('sheet-reset').classList.remove('open')">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Librería compartida Procepal -->
<script src="procepal-lib.js"></script>
<script>
const SUPABASE_URL_AUTH = SUPABASE_URL + '/auth/v1';
const ADMIN_PROXY_URL   = SUPABASE_URL.replace('supabase.co','supabase.co') + '/functions/v1/admin-proxy';

// ── AUTH ──────────────────────────────────────────────
let adminSession = null;
let adminUser    = null;
let usuarios     = [];
let filtroRol    = 'todos';
let filtroApp    = 'todas';
let filtroTexto  = '';

function getAdminToken() {
  if (adminSession?.access_token) return adminSession.access_token;
  try {
    const s = JSON.parse(localStorage.getItem('adm-session') || '{}');
    if (s.access_token) return s.access_token;
  } catch(e){}
  return SUPABASE_KEY;
}

// ── Login helpers ──────────────────────────────────────
function togglePass(btn) {
  const inp = document.getElementById('l-pass');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}
function onRememberChange() {
  const chk = document.getElementById('l-remember');
  if (!chk.checked) localStorage.removeItem('adm-remember-email');
}

// Pre-fill remembered email on load
(function initLogin() {
  const saved = localStorage.getItem('adm-remember-email');
  if (saved) {
    document.getElementById('l-email').value = saved;
    document.getElementById('l-remember').checked = true;
    document.getElementById('l-pass').focus();
  }
})();

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Ingresa correo y contraseña'; return; }

  try {
    const res = await fetch(SUPABASE_URL_AUTH + '/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();
    if (!res.ok || data.error) { errEl.textContent = data.error_description || data.error || 'Error de autenticación'; return; }

    // Verificar que sea admin
    const profileRes = await fetch(SUPABASE_URL + '/rest/v1/user_profiles?select=rol,nombre,activo', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + data.access_token }
    });
    const profiles = await profileRes.json();
    const profile  = profiles && profiles[0];

    if (!profile)           { errEl.textContent = 'Usuario sin perfil. Ejecuta el SQL de setup.'; return; }
    if (profile.rol !== 'admin') { errEl.textContent = 'Solo los administradores pueden acceder.'; return; }
    if (!profile.activo)    { errEl.textContent = 'Usuario desactivado.'; return; }

    adminSession = data;
    adminUser    = { ...profile, email };
    localStorage.setItem('adm-session', JSON.stringify(data));
    if (document.getElementById('l-remember').checked) {
      localStorage.setItem('adm-remember-email', email);
    } else {
      localStorage.removeItem('adm-remember-email');
    }

    document.getElementById('topbar-name').textContent = profile.nombre || email;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadUsuarios();
  } catch(e) {
    errEl.textContent = e.message;
  }
}

function doLogout() {
  adminSession = null; adminUser = null;
  localStorage.removeItem('adm-session');
  location.reload();
}

document.getElementById('l-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('l-email').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('l-pass').focus(); });

// ── ADMIN PROXY ───────────────────────────────────────
async function adminCall(action, extra = {}) {
  const res = await fetch(ADMIN_PROXY_URL, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + getAdminToken(),
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ action, ...extra })
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || 'Error en admin-proxy');
  return data;
}

// ── CARGAR USUARIOS ───────────────────────────────────
async function loadUsuarios() {
  try {
    const data = await adminCall('list_users');
    usuarios = data.users || [];
    renderMain();
  } catch(e) {
    document.getElementById('main-area').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">No se pudieron cargar usuarios</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

// ── RENDER PRINCIPAL ──────────────────────────────────
function renderMain() {
  const total    = usuarios.length;
  const activos  = usuarios.filter(u => u.activo).length;
  const admins   = usuarios.filter(u => u.rol === 'admin').length;
  const operativos = usuarios.filter(u => u.rol === 'operativo' || u.rol === 'director').length;

  const appDefs = [
    { v: 'todas',        l: '🌐 Todas',      color: 'var(--accent)' },
    { v: 'finanzas',     l: '💰 Finanzas',   color: '#4ade80' },
    { v: 'metalek',      l: '🏗️ MetalTek',   color: '#60a5fa' },
    { v: 'checador',     l: '📍 Checador',   color: '#fb923c' },
    { v: 'requisiciones',l: '📋 Requis.',    color: '#a78bfa' },
  ];

  let lista = usuarios.filter(u => {
    const txt = filtroTexto.toLowerCase();
    const matchTxt = !txt || u.nombre?.toLowerCase().includes(txt) || u.email?.toLowerCase().includes(txt);
    const matchRol = filtroRol === 'todos' || u.rol === filtroRol;
    const matchApp = filtroApp === 'todas' || (Array.isArray(u.apps) && u.apps.includes(filtroApp));
    return matchTxt && matchRol && matchApp;
  });

  // Conteos por app
  const cntApp = {};
  appDefs.forEach(a => {
    cntApp[a.v] = a.v === 'todas' ? total : usuarios.filter(u => Array.isArray(u.apps) && u.apps.includes(a.v)).length;
  });

  const rolFiltros = [
    { v: 'todos', l: `Todos (${total})` },
    { v: 'admin', l: 'Admin' },
    { v: 'director', l: 'Director' },
    { v: 'operativo', l: 'Operativo' },
    { v: 'trabajador', l: 'Trabajador' },
  ];

  const html = `
    <div class="section-header">
      <div>
        <div class="section-title">Usuarios</div>
        <div class="section-sub">${activos} activo${activos!==1?'s':''} de ${total} total</div>
      </div>
      <button class="btn-new" onclick="openNewUser()">+ Nuevo usuario</button>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--accent)">${activos}</div><div class="stat-lbl">Activos</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#FFD700">${admins}</div><div class="stat-lbl">Admins</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--accent2)">${operativos}</div><div class="stat-lbl">Operativos</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--danger)">${total-activos}</div><div class="stat-lbl">Inactivos</div></div>
    </div>

    <div class="search-row">
      <input class="search-input" placeholder="🔍  Buscar por nombre o correo..." oninput="filtroTexto=this.value;renderMain()" value="${filtroTexto}">
    </div>
    <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;padding-left:2px">Por rol</div>
    <div class="search-row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px">
      ${rolFiltros.map(f=>`<button class="filter-btn${filtroRol===f.v?' active':''}" onclick="filtroRol='${f.v}';renderMain()">${f.l}</button>`).join('')}
    </div>
    <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;padding-left:2px">Por app</div>
    <div class="search-row" style="flex-wrap:wrap;gap:6px;margin-bottom:16px">
      ${appDefs.map(a=>`<button class="filter-btn${filtroApp===a.v?' active':''}" style="${filtroApp===a.v?'border-color:'+a.color+';color:'+a.color+';background:'+a.color+'18':''}" onclick="filtroApp='${a.v}';renderMain()">${a.l} <span style="opacity:.6">(${cntApp[a.v]})</span></button>`).join('')}
    </div>

    <div class="user-list">
      ${lista.length === 0
        ? `<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">Sin usuarios</div><div class="empty-sub">Agrega el primero con "+ Nuevo usuario"</div></div>`
        : lista.map(u => renderUserCard(u)).join('')
      }
    </div>
  `;
  document.getElementById('main-area').innerHTML = html;
}

function rolBadge(rol) {
  const map = { admin: 'badge-admin', director: 'badge-director', operativo: 'badge-operativo', trabajador: 'badge-trabajador' };
  const ico = { admin: '👑', director: '📊', operativo: '⚙️', trabajador: '👷' };
  const cls = map[rol] || 'badge-trabajador';
  return `<span class="badge ${cls}">${ico[rol]||''} ${(rol||'').charAt(0).toUpperCase()+(rol||'').slice(1)}</span>`;
}

function appChips(apps) {
  if (!apps || !apps.length) return '<span style="font-size:11px;color:var(--dim)">Sin acceso a apps</span>';
  const map = { finanzas: { cls: 'app-finanzas', l: '💰 Finanzas' }, metalek: { cls: 'app-metalek', l: '🏗️ MetalTek' }, checador: { cls: 'app-checador', l: '📍 Checador' }, requisiciones: { cls: 'app-requisiciones', l: '📋 Req.' } };
  return apps.map(a => `<span class="app-chip ${map[a]?.cls||''}">${map[a]?.l||a}</span>`).join('');
}

function renderUserCard(u) {
  const initials = (u.nombre||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
  const fecha = u.created_at ? new Date(u.created_at).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}) : '';
  return `
    <div class="user-card${u.activo?'':' inactive'}" onclick="openEditUser('${u.id}')">
      <div class="user-card-top">
        <div class="user-avatar">${initials}</div>
        <div class="user-info">
          <div class="user-name">${u.nombre || '—'}</div>
          <div class="user-email">${u.email || ''}</div>
        </div>
        ${u.activo ? '' : '<span class="badge badge-inactivo">Inactivo</span>'}
      </div>
      <div class="user-meta">
        ${rolBadge(u.rol)}
        ${appChips(u.apps)}
        <span class="user-date">${fecha}</span>
      </div>
    </div>
  `;
}

// ── SHEET: NUEVO USUARIO ──────────────────────────────
function openNewUser() {
  document.getElementById('sheet-title').textContent = 'Nuevo usuario';
  document.getElementById('user-id').value = '';
  document.getElementById('user-nombre').value = '';
  document.getElementById('user-email').value = '';
  document.getElementById('user-password').value = '';
  document.getElementById('user-rol').value = 'operativo';
  document.getElementById('field-password').style.display = 'block';
  document.getElementById('edit-extra').style.display = 'none';
  document.getElementById('btn-save').textContent = 'Crear usuario';
  ['finanzas','metalek','checador','requisiciones'].forEach(a => {
    const el = document.getElementById('toggle-' + a);
    if (el) { el.classList.remove('checked'); el.querySelector('input').checked = false; }
  });
  document.getElementById('sheet-user').classList.add('open');
  setTimeout(() => document.getElementById('user-nombre').focus(), 300);
}

// ── SHEET: EDITAR USUARIO ─────────────────────────────
function openEditUser(userId) {
  const u = usuarios.find(x => x.id === userId);
  if (!u) return;
  document.getElementById('sheet-title').textContent = 'Editar usuario';
  document.getElementById('user-id').value = u.id;
  document.getElementById('user-nombre').value = u.nombre || '';
  document.getElementById('user-email').value = u.email || '';
  document.getElementById('user-password').value = '';
  document.getElementById('user-rol').value = u.rol || 'operativo';
  document.getElementById('field-password').style.display = 'none';
  document.getElementById('edit-extra').style.display = 'block';
  document.getElementById('btn-save').textContent = 'Guardar cambios';
  document.getElementById('btn-toggle-activo').textContent = u.activo ? '🚫 Desactivar usuario' : '✅ Reactivar usuario';
  ['finanzas','metalek','checador','requisiciones'].forEach(a => {
    const el = document.getElementById('toggle-' + a);
    if (!el) return;
    const on = (u.apps || []).includes(a);
    if (on) el.classList.add('checked'); else el.classList.remove('checked');
    el.querySelector('input').checked = on;
  });
  document.getElementById('sheet-user').classList.add('open');
}

function toggleApp(app, el) {
  el.classList.toggle('checked');
  el.querySelector('input').checked = el.classList.contains('checked');
}

function getAppsSeleccionadas() {
  return ['finanzas','metalek','checador','requisiciones'].filter(a => {
    const el = document.getElementById('toggle-' + a);
    return el && el.classList.contains('checked');
  });
}

// ── GUARDAR USUARIO ───────────────────────────────────
async function saveUser() {
  const id     = document.getElementById('user-id').value;
  const nombre = document.getElementById('user-nombre').value.trim();
  const email  = document.getElementById('user-email').value.trim();
  const pass   = document.getElementById('user-password').value;
  const rol    = document.getElementById('user-rol').value;
  const apps   = getAppsSeleccionadas();
  const btn    = document.getElementById('btn-save');

  if (!nombre || !email) { showToast('❌ Nombre y correo son obligatorios', true); return; }
  if (!id && !pass)       { showToast('❌ La contraseña es obligatoria para usuarios nuevos', true); return; }
  if (!id && pass.length < 8) { showToast('❌ La contraseña debe tener al menos 8 caracteres', true); return; }

  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    if (!id) {
      // Crear nuevo usuario
      await adminCall('create_user', { email, password: pass, nombre, rol, apps });
      showToast('✅ Usuario creado correctamente');
    } else {
      // Actualizar usuario existente
      await adminCall('update_user', { userId: id, nombre, rol, apps });
      showToast('✅ Usuario actualizado');
    }
    document.getElementById('sheet-user').classList.remove('open');
    await loadUsuarios();
  } catch(e) {
    showToast('❌ ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = id ? 'Guardar cambios' : 'Crear usuario';
  }
}

// ── TOGGLE ACTIVO ─────────────────────────────────────
async function toggleActivo() {
  const id = document.getElementById('user-id').value;
  const u  = usuarios.find(x => x.id === id);
  if (!u) return;
  const nuevoActivo = !u.activo;
  if (!confirm(`¿${nuevoActivo ? 'Reactivar' : 'Desactivar'} a ${u.nombre}?`)) return;
  try {
    await adminCall('update_user', { userId: id, activo: nuevoActivo });
    showToast(nuevoActivo ? '✅ Usuario reactivado' : '🚫 Usuario desactivado');
    document.getElementById('sheet-user').classList.remove('open');
    await loadUsuarios();
  } catch(e) { showToast('❌ ' + e.message, true); }
}

// ── ELIMINAR USUARIO ──────────────────────────────────
async function deleteUser() {
  const id = document.getElementById('user-id').value;
  const u  = usuarios.find(x => x.id === id);
  if (!u) return;
  if (!confirm(`¿Eliminar permanentemente a ${u.nombre} (${u.email})?\n\nEsta acción no se puede deshacer.`)) return;
  try {
    await adminCall('delete_user', { userId: id });
    showToast('🗑 Usuario eliminado');
    document.getElementById('sheet-user').classList.remove('open');
    await loadUsuarios();
  } catch(e) { showToast('❌ ' + e.message, true); }
}

// ── RESET PASSWORD ────────────────────────────────────
function showResetPassword() {
  document.getElementById('reset-pass').value = '';
  document.getElementById('sheet-reset').classList.add('open');
}
async function doResetPassword() {
  const id   = document.getElementById('user-id').value;
  const pass = document.getElementById('reset-pass').value;
  if (pass.length < 8) { showToast('❌ Mínimo 8 caracteres', true); return; }
  try {
    await adminCall('reset_password', { userId: id, newPassword: pass });
    showToast('✅ Contraseña actualizada');
    document.getElementById('sheet-reset').classList.remove('open');
  } catch(e) { showToast('❌ ' + e.message, true); }
}

// ── SHEET HELPERS ─────────────────────────────────────
function closeSheet(e) {
  if (e.target === document.getElementById('sheet-user'))
    document.getElementById('sheet-user').classList.remove('open');
}
function closeSheetReset(e) {
  if (e.target === document.getElementById('sheet-reset'))
    document.getElementById('sheet-reset').classList.remove('open');
}

// ── RESTORE SESSION ───────────────────────────────────
(async function restoreSession() {
  try {
    const raw = localStorage.getItem('adm-session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s.access_token) return;

    // Verificar que la sesión sigue activa
    const r = await fetch(SUPABASE_URL + '/rest/v1/user_profiles?select=rol,nombre,activo', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + s.access_token }
    });
    if (!r.ok) { localStorage.removeItem('adm-session'); return; }
    const profiles = await r.json();
    const p = profiles && profiles[0];
    if (!p || p.rol !== 'admin' || !p.activo) { localStorage.removeItem('adm-session'); return; }

    adminSession = s;
    adminUser    = { ...p };
    document.getElementById('topbar-name').textContent = p.nombre || '';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadUsuarios();
  } catch(e) { localStorage.removeItem('adm-session'); }
})();
</script>
